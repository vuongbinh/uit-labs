[project]
name = "uit-labs-real-estate"
version = "0.1.0"
description = "Vietnam real-estate listing research: text feature extraction and price-prediction baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
# PhoBERT embeddings are opt-in: torch is a large install and the TF-IDF path
# needs none of it.
phobert = [
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["real_estate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
