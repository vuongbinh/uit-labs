[project]
name = "vihate-demo"
version = "0.2.0"
description = "Gradio demo for Vietnamese hate-speech detection (bvuong/visoBert-ensemble)."
requires-python = ">=3.12"
dependencies = [
  "gradio>=5.50,<6",
  "pandas>=2.2",
  "sentencepiece>=0.2",
  "torch>=2.4",
  "transformers>=4.44,<5",
]

[dependency-groups]
dev = [
  "basedpyright>=1.20",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.uv]
# Not a distributable package: the root modules are the app.
package = false

# CPU-only torch keeps the Space build small (the default Linux wheel drags in
# several GB of CUDA libraries).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# The repo root also holds unrelated lab/homework content.
extend-exclude = ["cyber_bullying", "data", "docs", "notebooks", "src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# PLC0415: heavy imports stay inside fixtures/helpers. S106: the *_token= args are tokenizer special tokens, not credentials.
"tests/**/*.py" = ["D", "INP001", "PLC0415", "PLR2004", "S101", "S106"]

[tool.basedpyright]
include = ["app.py", "ui.py", "model.py", "batch.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
