[project]
name = "vihate"
version = "0.1.0"
description = "Vietnamese hate-speech training and cross-validation pipeline."
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "numpy>=2.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "transformers>=4.44",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.20",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
vihate = "vihate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vihate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
