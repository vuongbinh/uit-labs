[project]
name = "vihate"
version = "0.1.0"
description = "Vietnamese hate-speech training and cross-validation pipeline."
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "numpy>=2.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "sentencepiece>=0.2",
  "torch>=2.4",
  "transformers>=4.44,<5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.20",
  "pytest>=8.3",
  "ruff>=0.6",
]
# Optional: 8-bit AdamW (`--optim adamw_bnb_8bit`) for fine-tuning larger
# backbones (e.g. xlm-roberta-base) on memory-constrained GPUs.
bnb = [
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]

[project.scripts]
vihate = "vihate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vihate"]

[tool.ruff]
line-length = 100
target-version = "py312"
# This pyproject.toml also covers unrelated pre-existing lab/homework content
# (cyber_bullying/, data/) at the repo root; scope linting to the vihate
# package itself, matching basedpyright's `include` below.
extend-exclude = ["cyber_bullying", "data"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  # No copyright-header convention in this repo.
  "CPY001",
  # Heavy ML deps (torch, transformers, sklearn, datasets) are imported lazily
  # inside functions so `vihate --help` and syntax checks stay fast and work
  # even before `uv sync` installs them; see README_vihsd.md.
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "INP001", "PLR2004", "S101"]
# Typer commands legitimately expose one option per CLI flag, including
# boolean `--flag/--no-flag` options.
"src/vihate/cli.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# "all" is impractical here: sklearn, datasets, and transformers ship without
# type stubs, so exhaustive strictness mostly flags third-party `Unknown`
# types rather than real bugs in this package's code.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
